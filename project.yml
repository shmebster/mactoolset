name: MacToolbox
options:
  bundleIdPrefix: dev.webster
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  MacToolbox:
    type: application
    platform: macOS
    sources:
      - path: MacToolbox
        excludes:
          - "Resources/AppIcon.icon/**"
      - path: MacToolbox/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: MacToolbox/Info.plist
      properties:
        CFBundleDisplayName: Mac Toolbox
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSMicrophoneUsageDescription: Mac Toolbox записывает микрофон, если вы включили его в записи экрана или звука.
        NSAppleEventsUsageDescription: Mac Toolbox использует System Events, чтобы выключить Mac по таймеру сна.
        NSHumanReadableCopyright: © 2026 webster
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.webster.MacToolbox
        PRODUCT_NAME: MacToolbox
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
