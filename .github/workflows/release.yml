name: Release

# Пуш тега вида v0.2.0 → сборка → GitHub Release с DMG и ZIP.
# Ручной запуск (workflow_dispatch) только собирает и прикладывает файлы к запуску — релиз не публикуется.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия тестовой сборки"
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and package
        run: scripts/package.sh "${{ steps.version.outputs.version }}" "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: MacToolbox-${{ steps.version.outputs.version }}
          path: dist/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Заметки — раздел «## <версия>» из CHANGELOG.md, иначе автогенерация GitHub.
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if (index($0, "## " v) == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          cat docs/release-footer.md >> notes.md

          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          if [[ -s notes.md ]]; then FLAGS+=(--notes-file notes.md); else FLAGS+=(--generate-notes); fi

          gh release create "$GITHUB_REF_NAME" dist/* --title "Mac Toolbox $VERSION" "${FLAGS[@]}"
